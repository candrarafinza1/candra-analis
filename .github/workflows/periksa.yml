# Dijalankan setiap ada kode baru. Rilis ke Vercel hanya aman bila pemeriksaan ini hijau.
name: Periksa sebelum rilis
on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek sintaks JavaScript
        run: for f in assets/*.js data/*.js api/*.mjs tests/*.mjs tools/*.js; do node --check "$f"; done
      - name: Pasang pustaka Python untuk cek modul PDF (gratis, dari PyPI)
        run: sudo python3 -m pip install --break-system-packages "reportlab>=4,<6" "pypdf>=5,<7"
      - name: Cek sintaks Python (skrip modul PDF)
        run: python3 -m py_compile tools/*.py
      - name: Pemeriksaan QA (tautan, data, bahasa ajakan)
        run: node tests/cek.mjs
